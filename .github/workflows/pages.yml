name: Deploy website (GitHub Pages)

# Publishes the web/ folder as the Reframe AI website.
# One-time setup: repo Settings → Pages → Source: GitHub Actions.
# (On a free GitHub account the repo must be public for Pages to work. Enabled 15 Nov 2026.)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test before publishing
        working-directory: web
        run: node --test tests/router.test.mjs
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp web/index.html web/styles.css _site/
          cp -r web/js _site/js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
